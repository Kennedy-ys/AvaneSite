name: Security Scan

on:
  push:
    branches: [main, develop]
    paths:
      - "**.js"
      - "**.mjs"
      - "**.cjs"
      - "**.config.*"
      - "package.json"
      - ".github/workflows/security-scan.yml"
  pull_request:
    branches: [main, develop]

jobs:
  security-check:
    runs-on: ubuntu-latest
    name: Detect Malicious Patterns

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Check for obfuscation patterns
        run: |
          echo "🔍 Scanning for obfuscation patterns..."

          # Check for global variable assignments (common in malware)
          if git diff origin/main...HEAD --unified=0 | grep -E '^[+].*global\.[a-z_]+='; then
            echo "❌ FAILED: Suspicious global variable assignment detected"
            exit 1
          fi

          # Check for obfuscated variable names
          if git diff origin/main...HEAD --unified=0 | grep -E '^[+].*_\$_[0-9a-f]+'; then
            echo "❌ FAILED: Obfuscated variable names detected"
            exit 1
          fi

          # Check for dynamic function execution
          if git diff origin/main...HEAD --unified=0 | grep -E '^[+].*(Function\(|new Function)'; then
            echo "⚠️  WARNING: Dynamic function execution detected"
            echo "    Please review: new Function() or Function() calls"
          fi

          echo "✅ Obfuscation check passed"

      - name: Validate config file syntax
        run: |
          echo "Validating config files..."

          for file in postcss.config.mjs next.config.js tailwind.config.js eslint.config.js; do
            if [ -f "$file" ]; then
              if ! node -c "$file" 2>/dev/null; then
                echo "❌ FAILED: Syntax error in $file"
                exit 1
              fi
              echo "✅ $file - syntax OK"
            fi
          done

      - name: Run security script
        run: npm run security:check
        if: hashFiles('scripts/security-check.js') != ''

      - name: Check for eval() calls
        run: |
          echo "Checking for eval() patterns..."

          if git diff origin/main...HEAD | grep -E '^[+].*(eval\(|createRequire.*eval)'; then
            echo "⚠️  WARNING: eval() or createRequire+eval patterns found"
            echo "    These should be avoided in production code"
          fi
